<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="login-box">
            <h1>Ganti Password</h1>
            <p>Password lama tersimpan sebagai hash dan tidak dapat ditampilkan kembali.</p>
            <form id="password-form">
                <div class="input-group">
                    <label for="nip">NIP</label>
                    <input type="text" id="nip" name="nip" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label for="current-password">Password saat ini</label>
                    <input type="password" id="current-password" name="current_password" autocomplete="current-password" required>
                </div>
                <div class="input-group">
                    <label for="new-password">Password baru (minimal 8 karakter)</label>
                    <input type="password" id="new-password" name="new_password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Ulangi password baru</label>
                    <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </div>
                <p id="form-message" role="status" aria-live="polite"></p>
                <button type="submit" class="login-btn">Simpan Password Baru</button>
            </form>
            <p class="register-link"><a href="index.html">Kembali ke login</a></p>
        </section>
    </main>
    <script>
        const form = document.getElementById('password-form');
        const message = document.getElementById('form-message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';

            const formData = new FormData(form);
            const newPassword = formData.get('new_password');
            if (newPassword !== formData.get('confirm_password')) {
                message.textContent = 'Konfirmasi password baru tidak cocok.';
                return;
            }

            try {
                const response = await fetch('API/update_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nip: formData.get('nip'),
                        current_password: formData.get('current_password'),
                        new_password: newPassword
                    })
                });
                const result = await response.json();
                message.textContent = result.message || result.error || 'Terjadi kesalahan.';
                if (response.ok && result.ok) form.reset();
                if (response.status === 401) {
                    message.textContent = 'Silakan login terlebih dahulu untuk mengganti password.';
                }
            } catch (error) {
                message.textContent = 'Tidak dapat menghubungi server. Coba lagi.';
            }
        });
    </script>
</body>
</html>
