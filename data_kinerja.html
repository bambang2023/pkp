<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Kinerja</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f0f2f5; color: #212529; }
        .navbar { background: linear-gradient(135deg, #1a237e, #0d47a1); padding: 18px 28px; }
        .navbar a { color: #fff; text-decoration: none; font-weight: 600; }
        .container { max-width: 1500px; margin: 28px auto; padding: 0 20px; }
        .panel { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { margin: 0; font-size: 24px; }
        .button { display: inline-block; padding: 10px 16px; border-radius: 6px; color: #fff; background: #0d6efd; text-decoration: none; }
        .filter { padding: 9px; border: 1px solid #ced4da; border-radius: 5px; }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1050px; }
        th, td { border: 1px solid #dee2e6; padding: 9px 10px; text-align: left; white-space: nowrap; }
        th { background: #e9ecef; }
        .status { margin-top: 16px; padding: 12px; border-radius: 6px; }
        .error { color: #842029; background: #f8d7da; border: 1px solid #f5c2c7; }
        .empty { color: #664d03; background: #fff3cd; border: 1px solid #ffecb5; }
        .number { text-align: right; }
        .button-edit { padding: 6px 12px; color: #212529; background: #ffc107; border: 0; border-radius: 4px; cursor: pointer; }
        .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(15, 23, 42, .55); z-index: 10; }
        .modal-backdrop[hidden] { display: none; }
        .modal { width: min(520px, 100%); padding: 24px; background: #fff; border-radius: 8px; box-shadow: 0 12px 35px rgba(0, 0, 0, .2); }
        .modal-header, .modal-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .modal-header { margin-bottom: 18px; }
        .modal-header h2 { margin: 0; font-size: 20px; }
        .modal-close, .button-cancel, .button-save { padding: 9px 12px; border: 1px solid #ced4da; border-radius: 5px; background: #fff; cursor: pointer; }
        .modal-close { font-size: 20px; line-height: 1; }
        .modal-details { margin: 0 0 18px; color: #495057; line-height: 1.6; }
        .modal-field { display: grid; gap: 6px; margin-bottom: 14px; }
        .modal-field input { width: 100%; padding: 9px; border: 1px solid #ced4da; border-radius: 5px; }
        .modal-error { margin-bottom: 14px; padding: 10px; color: #842029; background: #f8d7da; border-radius: 5px; }
        .button-save { color: #fff; background: #0d6efd; border-color: #0d6efd; }
        .modal-actions { justify-content: flex-end; margin-top: 18px; }
    </style>
</head>
<body>
    <nav class="navbar"><a href="puskesmas.html">PKP Jawa Timur</a></nav>
    <main class="container">
        <section class="panel">
            <div class="toolbar">
                <h1>Data Kinerja</h1>
                <div>
                    <select id="bulanFilter" class="filter" aria-label="Filter bulan">
                        <option value="">Semua bulan</option>
                        <option value="01">Januari</option>
                        <option value="02">Februari</option>
                        <option value="03">Maret</option>
                        <option value="04">April</option>
                        <option value="05">Mei</option>
                        <option value="06">Juni</option>
                        <option value="07">Juli</option>
                        <option value="08">Agustus</option>
                        <option value="09">September</option>
                        <option value="10">Oktober</option>
                        <option value="11">November</option>
                        <option value="12">Desember</option>
                    </select>
                    <a class="button" href="input_kinerja.html">Input Kinerja</a>
                </div>
            </div>
            <div id="status" class="status" hidden></div>
            <div class="table-wrap">
                <table id="dataTable" hidden>
                    <thead><tr>
                        <th>Bulan</th><th>Kode Indikator</th><th>Indikator</th><th>Target</th><th>Satuan</th>
                        <th>Total Sasaran</th><th>Target Sasaran</th><th>Capaian</th>
                        <th>Hasil Riil</th><th>Hasil Kinerja</th><th>Aksi</th>
                    </tr></thead>
                    <tbody id="dataBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <div id="editModal" class="modal-backdrop" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
            <div class="modal-header">
                <h2 id="editModalTitle">Edit Data Kinerja</h2>
                <button class="modal-close" type="button" id="closeModalButton" aria-label="Tutup">&times;</button>
            </div>
            <p id="editDetails" class="modal-details"></p>
            <form id="editForm">
                <label class="modal-field" for="editTotalSasaran">Total Sasaran
                    <input id="editTotalSasaran" name="jml_sasaran" type="number" min="0" step="any" required>
                </label>
                <label class="modal-field" for="editCapaian">Capaian
                    <input id="editCapaian" name="capaian" type="number" min="0" step="any" required>
                </label>
                <div id="modalError" class="modal-error" hidden></div>
                <div class="modal-actions">
                    <button class="button-cancel" type="button" id="cancelButton">Batal</button>
                    <button class="button-save" type="submit" id="saveButton">Simpan Perubahan</button>
                </div>
            </form>
        </section>
    </div>
    <script>
        const monthNames = {
            '01': 'Januari', '02': 'Februari', '03': 'Maret', '04': 'April',
            '05': 'Mei', '06': 'Juni', '07': 'Juli', '08': 'Agustus',
            '09': 'September', '10': 'Oktober', '11': 'November', '12': 'Desember'
        };
        const statusBox = document.getElementById('status');
        const table = document.getElementById('dataTable');
        const body = document.getElementById('dataBody');
        const monthFilter = document.getElementById('bulanFilter');
        let rows = [];
        let visibleRows = [];

        function escapeHtml(value) {
            const element = document.createElement('div');
            element.textContent = value == null ? '' : String(value);
            return element.innerHTML;
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = `status ${type}`;
            statusBox.hidden = false;
        }

        function render() {
            visibleRows = monthFilter.value
                ? rows.filter(row => String(row.bulan).padStart(2, '0') === monthFilter.value)
                : [...rows].sort((first, second) => {
                    const monthOrder = Number(first.bulan) - Number(second.bulan);
                    return monthOrder || String(first.kdindikator).localeCompare(String(second.kdindikator));
                });
            body.innerHTML = visibleRows.map((row, index) => `
                <tr>
                    <td>${escapeHtml(monthNames[String(row.bulan).padStart(2, '0')] || row.bulan)}</td>
                    <td>${escapeHtml(row.kdindikator)}</td>
                    <td>${escapeHtml(row.indikator)}</td>
                    <td class="number">${escapeHtml(row.target)}</td>
                    <td>${escapeHtml(row.sasaran)}</td>
                    <td class="number">${escapeHtml(row.jml_sasaran)}</td>
                    <td class="number">${escapeHtml(row.target_sasaran)}</td>
                    <td class="number">${escapeHtml(row.capaian)}</td>
                    <td class="number">${escapeHtml(row.hasil_riil)}</td>
                    <td class="number">${escapeHtml(row.hasil_kinerja)}</td>
                    <td><button class="button-edit" type="button" data-edit-index="${index}">Edit</button></td>
                </tr>
            `).join('');
            table.hidden = visibleRows.length === 0;
            if (visibleRows.length === 0) showStatus('Belum ada data kinerja untuk filter ini.', 'empty');
            else statusBox.hidden = true;
        }

        function openEditModal(row) {
            document.getElementById('editForm').dataset.bulan = row.bulan;
            document.getElementById('editForm').dataset.kdindikator = row.kdindikator;
            document.getElementById('editDetails').textContent = `${monthNames[String(row.bulan).padStart(2, '0')] || row.bulan} | ${row.kdindikator} - ${row.indikator} | Target: ${row.target} ${row.sasaran}`;
            document.getElementById('editTotalSasaran').value = row.jml_sasaran;
            document.getElementById('editCapaian').value = row.capaian;
            document.getElementById('modalError').hidden = true;
            document.getElementById('editModal').hidden = false;
            document.getElementById('editTotalSasaran').focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').hidden = true;
            document.getElementById('modalError').hidden = true;
        }

        async function updateData(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const saveButton = document.getElementById('saveButton');
            const modalError = document.getElementById('modalError');
            const payload = {
                bulan: form.dataset.bulan,
                kdindikator: form.dataset.kdindikator,
                jml_sasaran: document.getElementById('editTotalSasaran').value,
                capaian: document.getElementById('editCapaian').value,
            };
            saveButton.disabled = true;
            saveButton.textContent = 'Menyimpan...';
            modalError.hidden = true;

            try {
                const response = await fetch('API/update_data_kinerja.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify(payload),
                });
                const result = await response.json();
                if (!response.ok || result.ok !== true) {
                    throw new Error(result.error || 'Gagal memperbarui data kinerja.');
                }
                closeEditModal();
                await loadData();
            } catch (error) {
                modalError.textContent = error.message || 'Gagal memperbarui data kinerja.';
                modalError.hidden = false;
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Simpan Perubahan';
            }
        }

        async function loadData() {
            try {
                const response = await fetch('API/get_data_kinerja.php', { headers: { Accept: 'application/json' } });
                const payload = await response.json();
                if (!response.ok || payload.ok !== true) throw new Error(payload.error || 'Gagal memuat data kinerja.');
                rows = Array.isArray(payload.data) ? payload.data : [];
                render();
            } catch (error) {
                table.hidden = true;
                showStatus(error.message, 'error');
            }
        }

        monthFilter.addEventListener('change', render);
        body.addEventListener('click', event => {
            const button = event.target.closest('[data-edit-index]');
            if (button) openEditModal(visibleRows[Number(button.dataset.editIndex)]);
        });
        document.getElementById('editForm').addEventListener('submit', updateData);
        document.getElementById('closeModalButton').addEventListener('click', closeEditModal);
        document.getElementById('cancelButton').addEventListener('click', closeEditModal);
        loadData();
    </script>
</body>
</html>
